; PlatformIO project for the Inchiscope Arduino Mega firmware.
; This board is a pure servo loop: it executes piston/valve setpoints and
; streams raw sensor telemetry. All kinematics and calibration math live on
; the PC side (inchiscope_pba_control, inchiscope_ab_control).

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPRLS Library@^1.2.1
    adafruit/Adafruit BusIO@^1.16
    adafruit/Adafruit Unified Sensor@^1.1
