# Inchiscope stack parameters.
#
# Values marked PLACEHOLDER need bench calibration / the paper's characterisation
# data before they can be trusted; they exist so nodes have a param to declare
# against, not as validated numbers.

serial_bridge_node:
  ros__parameters:
    port: /dev/ttyACM1
    baud: 115200
    piston_at_target_threshold_mm: 0.1
    telemetry_timeout_sec: 1.0

pba_control_node:
  ros__parameters:
    # Bellows polynomial coefficients from the original firmware main.cpp
    # (length_mm = a*p^3 + b*p^2 + c*p + d, p = piston length mm). Carried
    # over as-is; PLACEHOLDER pending re-fit once the CC model is ported.
    bellows_poly_a: -3.11672313e-04
    bellows_poly_b: 3.15655556e-02
    bellows_poly_c: -6.15190111e-01
    bellows_poly_d: 8.81574747e+00
    min_piston_length_mm: 10.0
    max_piston_length_mm: 60.0
    chamber_radius_mm: 2.5

ab_control_node:
  ros__parameters:
    # PLACEHOLDER hard ceilings -- derive real values from the anchoring-force
    # characterisation in the paper (section III-A) before running on hardware.
    pressure_ceiling_kpa:
      proximal: 100.0
      central: 100.0
      distal: 100.0

aurora_tracker_node:
  ros__parameters:
    field_generator_port: /dev/ttyUSB0
    sensor_srom_path: "src/inchiscope_bringup/config/sroms/1750_6D.rom"
    publish_rate_hz: 40.0
    reconnect_period_sec: 5.0
    field_frame_id: aurora_field
    reference_frame_id: aurora_reference
    sensor_frame_id: aurora_sensor_0

camera_node:
  ros__parameters:
    device: /dev/video0
    # The sensor's real content is only ~320x320; this capture card pads it
    # with a black border (+ a logo/info overlay in part of that border) to
    # whichever fixed resolution is requested, then scales the whole padded
    # frame up. Confirmed via `v4l2-ctl -d /dev/video0 --list-formats-ext`:
    # 640x480 is the SMALLEST size this device offers in either MJPG or
    # YUYV (1920x1080 down through several 4:3/5:4 sizes to 640x480) -- so
    # it's the least-upscaled/least-wasteful option available, not an
    # arbitrary choice. MJPG hits 60fps at every size this device offers,
    # so there's no framerate reason to prefer a bigger one.
    pixel_format: MJPG
    width: 640
    height: 480
    fps: 30.0
    frame_id: naneye_camera
    # PLACEHOLDER -- crop out the black border/logo overlay above. Disabled
    # (crop_width/crop_height == 0) until measured against a real saved
    # frame at 640x480; see src/inchiscope_camera/README.md for how.
    crop_x: 0
    crop_y: 0
    crop_width: 0
    crop_height: 0
