# Reference list of topics captured by record.launch.py.
#
# Deliberately excludes high-rate low-level telemetry (/firmware/piston_state,
# /firmware/pressure_state) -- section 5 of inchiscope_ros2_architecture.md
# calls out keeping the bag to what's needed for offline 3D reconstruction.
topics:
  - /camera/image_raw
  - /aurora/sensor_0/pose_relative_to_reference  # world-frame sensor pose for reconstruction
  - /aurora/reference/pose                       # raw reference pose, for sanity-checking it didn't move
  - /inchiscope/state
